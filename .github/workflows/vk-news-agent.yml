name: "АвтоТочка — Новостной ИИ-агент ВК"

on:
  schedule:
    # 3 публикации в день по времени Ярославля / МСК (UTC+3): ~08:15, ~13:15 и ~19:15
    - cron: "15 5 * * *"
    - cron: "15 10 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый запуск (без публикации в ВК — покажет готовый пост в отчёте)"
        required: false
        type: boolean
        default: false
      mode:
        description: "Рубрика выпуска"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - news
          - tip
      max_posts:
        description: "Количество постов за запуск"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"

concurrency:
  group: vk-news-agent-autoyar076
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    name: "Поиск новостей и публикация в vk.ru/autoyar076"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN || secrets.VK_ACCESS_TOKEN || secrets.VK_API_TOKEN || secrets.TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP: ${{ secrets.VK_GROUP }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY || secrets.GIGACHAT_KEY || secrets.GIGACHAT_API_KEY || secrets.GIGACHAT_CREDENTIALS }}
      GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY || secrets.YANDEX_GPT_API_KEY }}
      YANDEX_IAM_TOKEN: ${{ secrets.YANDEX_IAM_TOKEN }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      YANDEX_MODEL: ${{ secrets.YANDEX_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка утилит конвертации WebP-изображений
        run: |
          if ! command -v convert >/dev/null 2>&1 && ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: Запуск новостного ИИ-агента «АвтоТочка»
        id: run_agent
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          MODE="${{ inputs.mode || 'auto' }}"
          MAX_POSTS="${{ inputs.max_posts || '1' }}"

          # Если это автоматический запуск по расписанию, а секреты ещё не добавлены — тихо ждём настройки без красной ошибки
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "${VK_TOKEN}" ]; then
            echo "⏸️ Автозапуск ожидает настройки секретов VK_TOKEN и GIGACHAT_AUTH_KEY (или YANDEX_API_KEY + YANDEX_FOLDER_ID)."
            {
              echo "## ⏸️ Новостной агент «АвтоТочка» ожидает подключения ключей"
              echo "Добавьте секреты **\`VK_TOKEN\`** и ключ нейросети (**\`GIGACHAT_AUTH_KEY\`** или **\`YANDEX_API_KEY\` + \`YANDEX_FOLDER_ID\`**) в разделе:"
              echo "\`Settings → Secrets and variables → Actions → New repository secret\`."
              echo ""
              echo "Подробная пошаговая инструкция находится в [\`vk-news-agent/README.md\`](vk-news-agent/README.md)."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          EXTRA_ARGS=(--mode "${MODE}" --max-posts "${MAX_POSTS}")
          if [ "${DRY_RUN}" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          python3 vk-news-agent/agent.py "${EXTRA_ARGS[@]}"

      - name: Сохранение истории опубликованных новостей (защита от повторов)
        if: success() && inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet vk-news-agent/state/published.json; then
            echo "История публикаций не изменилась."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-news-agent/state/published.json
          git commit -m "chore(vk-news-agent): update published history [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
