name: "Греем Мотор — Оформление группы ВК (в 1 клик)"

on:
  push:
    branches:
      - arena/18a9cae3-witch-game
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверка (без изменений в группе ВК)"
        required: false
        type: boolean
        default: false
      apply_info:
        description: "Обновить название «Греем Мотор», тематику, статус и описание группы"
        required: false
        type: boolean
        default: true
      apply_cover:
        description: "Установить обложку (шапку 1920×768)"
        required: false
        type: boolean
        default: true
      apply_avatar:
        description: "Установить круглый аватар-логотип (1024×1024)"
        required: false
        type: boolean
        default: true
      apply_pinned:
        description: "Опубликовать/обновить и закрепить приветственный пост с баннером"
        required: false
        type: boolean
        default: true
      rewrite_wall:
        description: "Переписать уже выпущенные посты на стене под стиль «Греем Мотор»"
        required: false
        type: boolean
        default: false
      backfill_photos:
        description: "Догрузить пропущенные фото к недавним постам на стене"
        required: false
        type: boolean
        default: true
      force_new_pinned:
        description: "Создать новый закреп вместо обновления существующего"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  setup-branding:
    name: "Установка оформления «Греем Мотор» в vk.ru/greem_motor"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN || secrets.VK_ACCESS_TOKEN || secrets.VK_API_TOKEN || secrets.TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN || secrets.VK_ADMIN_TOKEN || secrets.USER_TOKEN || secrets.VK_USER_KEY || secrets.USER_VK_TOKEN }}
      VK_GROUP: ${{ secrets.VK_GROUP }}
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY || secrets.GIGACHAT_KEY || secrets.GIGACHAT_API_KEY || secrets.GIGACHAT_CREDENTIALS || secrets.GIGACHAT_TOKEN }}
      GIGACHAT_CLIENT_ID: ${{ secrets.GIGACHAT_CLIENT_ID }}
      GIGACHAT_CLIENT_SECRET: ${{ secrets.GIGACHAT_CLIENT_SECRET || secrets.GIGACHAT_SECRET }}
      GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}

    steps:
      - name: Получение кода и графики оформления
        uses: actions/checkout@v4

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка утилит конвертации изображений
        run: |
          if ! command -v convert >/dev/null 2>&1 && ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
          fi

      - name: Применение оформления сообщества «Греем Мотор»
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 vk-news-agent/setup_group_profile.py --skip-info --skip-cover --skip-avatar --skip-pinned --skip-backfill --rewrite-wall --keep-all-photos --save-verify-json vk-news-agent/state/_plain_verify.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vk-news-agent/state/_plain_verify.json || true
            git commit -m "chore(vk): verify GigaChat-2 plain-language wall rewrite [skip ci]" || true
            git push origin HEAD:arena/18a9cae3-witch-game || true
            exit 0
          fi
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ inputs.apply_info }}" = "false" ]; then
            ARGS+=(--skip-info)
          fi
          if [ "${{ inputs.apply_cover }}" = "false" ]; then
            ARGS+=(--skip-cover)
          fi
          if [ "${{ inputs.apply_avatar }}" = "false" ]; then
            ARGS+=(--skip-avatar)
          fi
          if [ "${{ inputs.apply_pinned }}" = "false" ]; then
            ARGS+=(--skip-pinned)
          fi
          if [ "${{ inputs.rewrite_wall }}" = "true" ]; then
            ARGS+=(--rewrite-wall)
          fi
          if [ "${{ inputs.backfill_photos }}" = "false" ]; then
            ARGS+=(--skip-backfill)
          fi
          if [ "${{ inputs.force_new_pinned }}" = "true" ]; then
            ARGS+=(--force-new-pinned)
          fi
          python3 vk-news-agent/setup_group_profile.py "${ARGS[@]}"

      - name: Сохранение состояния оформления
        if: success() && inputs.dry_run != true && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if git diff --quiet vk-news-agent/state/branding_state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vk-news-agent/state/branding_state.json
          git commit -m "chore(vk-news-agent): update branding state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
