name: "АвтоТочка — Оформление группы ВК (в 1 клик)"

on:
  push:
    branches:
      - "arena/4e4089f3-witch-game"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверка (без изменений в группе ВК)"
        required: false
        type: boolean
        default: false
      apply_info:
        description: "Обновить название «АвтоТочка», статус и описание группы"
        required: false
        type: boolean
        default: true
      apply_cover:
        description: "Установить обложку (шапку 1920×768)"
        required: false
        type: boolean
        default: true
      apply_avatar:
        description: "Установить круглый аватар-логотип (1024×1024)"
        required: false
        type: boolean
        default: true
      apply_pinned:
        description: "Опубликовать и закрепить приветственный пост с баннером"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  setup-branding:
    name: "Установка оформления «АвтоТочка» в vk.ru/autoyar076"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      VK_TOKEN: ${{ secrets.VK_TOKEN || secrets.VK_ACCESS_TOKEN || secrets.VK_API_TOKEN || secrets.TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP: ${{ secrets.VK_GROUP }}
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY || secrets.GIGACHAT_KEY || secrets.GIGACHAT_API_KEY || secrets.GIGACHAT_CREDENTIALS || secrets.GIGACHAT_TOKEN }}
      GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ secrets.GIGACHAT_MODEL }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY || secrets.YANDEX_GPT_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}

    steps:
      - name: Получение кода и графики оформления
        uses: actions/checkout@v4

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Применение оформления сообщества «АвтоТочка»
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 vk-news-agent/agent.py --diagnose vk-news-agent/state/diag.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vk-news-agent/state/diag.json
            git commit -m "chore: diagnostic report [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 0
          fi
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ inputs.apply_info }}" = "false" ]; then
            ARGS+=(--skip-info)
          fi
          if [ "${{ inputs.apply_cover }}" = "false" ]; then
            ARGS+=(--skip-cover)
          fi
          if [ "${{ inputs.apply_avatar }}" = "false" ]; then
            ARGS+=(--skip-avatar)
          fi
          if [ "${{ inputs.apply_pinned }}" = "false" ]; then
            ARGS+=(--skip-pinned)
          fi
          python3 vk-news-agent/setup_group_profile.py "${ARGS[@]}"
