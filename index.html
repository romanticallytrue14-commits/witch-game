<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e0d">
  <title>Ведьмина лавка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <header class="head">
      <h1>Ведьмина лавка</h1>
      <p class="tagline">Мрачная сказка у края леса</p>
    </header>

    <canvas id="scene" width="600" height="340" role="img"
      aria-label="Избушка ведьмы в ночном лесу: луна, котёл на огне и гость у двери"></canvas>

    <div id="stats" class="stats">
      <div class="stat"><span>Монеты</span><strong id="stat-coins">0</strong></div>
      <div class="stat"><span>Заказы</span><strong id="stat-served">0</strong></div>
      <div class="stat"><span>Серия</span><strong id="stat-streak">0</strong></div>
      <div class="stat"><span>Ушло</span><strong id="stat-left">0</strong></div>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Гость у дверей</h2>
        <span id="attempts" class="badge">попыток: 2</span>
      </div>
      <p id="order"></p>
      <p id="guest-hint" class="muted"></p>
      <p id="revealed" class="muted small" aria-live="polite"></p>
      <p id="reward" class="muted"></p>
      <button id="hint" class="ghost">🕯 Подсказка — 4 🪙</button>
    </section>

    <section class="card">
      <h2>🌲 Тёмный лес</h2>
      <p id="stock" class="stock"></p>
      <p id="forest-message" class="muted" aria-live="polite">Между деревьями что-то мерцает...</p>
      <div class="row">
        <button id="gather-edge">🌾 На опушку</button>
        <button id="gather-deep">🌲 В чащу</button>
      </div>
    </section>

    <section class="card">
      <h2>Котёл</h2>
      <p id="status" aria-live="polite">Выбери два ингредиента для зелья.</p>
      <div id="ingredients" class="ingredients"></div>
      <div class="row">
        <button id="brew">🔥 Сварить зелье</button>
        <button id="clear" class="ghost">Очистить котёл</button>
      </div>
    </section>

    <section class="card">
      <h2>📖 Гримуар</h2>
      <p class="muted small">Рецепт открывается, когда зелье удаётся впервые.</p>
      <ul id="grimoire" class="grimoire"></ul>
    </section>

    <section class="card">
      <h2>🕯 Лавка</h2>
      <div id="upgrades" class="upgrades"></div>
    </section>

    <footer class="foot">
      <button id="sound">🔇 Включить звук</button>
      <button id="reset" class="ghost danger">Начать заново</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
